name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: conteo-github-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar con Firebase configurado
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          : "${VITE_FIREBASE_API_KEY:?Falta VITE_FIREBASE_API_KEY}"
          : "${VITE_FIREBASE_AUTH_DOMAIN:?Falta VITE_FIREBASE_AUTH_DOMAIN}"
          : "${VITE_FIREBASE_PROJECT_ID:?Falta VITE_FIREBASE_PROJECT_ID}"
          : "${VITE_FIREBASE_APP_ID:?Falta VITE_FIREBASE_APP_ID}"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
